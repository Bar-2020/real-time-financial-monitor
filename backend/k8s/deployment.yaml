apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-monitor-api
  labels:
    app: financial-monitor-api
spec:
  replicas: 5
  selector:
    matchLabels:
      app: financial-monitor-api
  template:
    metadata:
      labels:
        app: financial-monitor-api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: financial-monitor-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Redis
              value: redis:6379
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
